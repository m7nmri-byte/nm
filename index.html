<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>جدول برنامج النماص</title>
  <style>
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: #f4f6f9;
      color: #333;
      padding: 20px;
    }

    .container {
      max-width: 600px;
      margin: 0 auto;
    }

    h2 {
      text-align: center;
      color: #1a252f;
    }

    .program-card {
      background: #ffffff;
      border: 2px solid #e2e8f0;
      border-radius: 10px;
      padding: 15px 20px;
      margin-bottom: 12px;
      transition: all 0.4s ease;
      position: relative;
    }

    /* الستايل الخاص بالبرنامج الحالي */
    .program-card.active {
      background-color: #2563eb;
      color: #ffffff;
      border-color: #1d4ed8;
      box-shadow: 0 10px 20px rgba(37, 99, 235, 0.3);
      transform: scale(1.03);
    }

    .program-card.active .status-badge {
      display: inline-block;
      background-color: #ef4444;
      color: white;
      padding: 2px 8px;
      border-radius: 12px;
      font-size: 0.8rem;
      font-weight: bold;
      animation: pulse 1.5s infinite;
    }

    .time-range {
      font-size: 0.9rem;
      opacity: 0.8;
      margin-top: 5px;
    }

    .status-badge {
      display: none;
    }

    @keyframes pulse {
      0% { opacity: 1; }
      50% { opacity: 0.5; }
      100% { opacity: 1; }
    }
  </style>
</head>
<body>

<div class="container">
  <h2>جدول البرامج اليومي</h2>
  <div id="schedule"></div>
</div>

<script>
  // قائمة البرامج مع أوقات البداية والنهاية بصيغة (HH:MM)
  const scheduleData = [
    { id: 1, title: "البرنامج الصباحي", start: "08:00", end: "10:00" },
    { id: 2, title: "فقرة الحوار المباشر", start: "10:00", end: "12:30" },
    { id: 3, title: "الأخبار والتغطية الخاصة", start: "12:30", end: "15:00" },
    { id: 4, title: "البرنامج المسائي", start: "15:00", end: "18:00" },
    { id: 5, title: "البث الليلة والختام", start: "18:00", end: "23:59" }
  ];

  let currentActiveId = null;

  function renderSchedule() {
    const container = document.getElementById('schedule');
    container.innerHTML = '';

    scheduleData.forEach(item => {
      const card = document.createElement('div');
      card.className = 'program-card';
      card.id = `program-${item.id}`;
      card.innerHTML = `
        <div style="display: flex; justify-content: space-between; align-items: center;">
          <h3 style="margin: 0;">${item.title}</h3>
          <span class="status-badge">مباشر الآن</span>
        </div>
        <div class="time-range">من ${item.start} إلى ${item.end}</div>
      `;
      container.appendChild(card);
    });
  }

  function updateActiveProgram() {
    const now = new Date();
    const currentMinutes = now.getHours() * 60 + now.getMinutes();

    let foundActive = false;

    scheduleData.forEach(item => {
      const [startH, startM] = item.start.split(':').map(Number);
      const [endH, endM] = item.end.split(':').map(Number);

      const startMinutes = startH * 60 + startM;
      const endMinutes = endH * 60 + endM;

      const card = document.getElementById(`program-${item.id}`);

      if (currentMinutes >= startMinutes && currentMinutes < endMinutes) {
        foundActive = true;
        if (currentActiveId !== item.id) {
          // إزالة التمييز عن السابق
          document.querySelectorAll('.program-card').forEach(c => c.classList.remove('active'));
          
          // إضافة التمييز للبرنامج الحالي
          card.classList.add('active');
          currentActiveId = item.id;

          // التمرير التلقائي للبرنامج الحالي ليكون في منتصف الشاشة
          card.scrollIntoView({ behavior: 'smooth', block: 'center' });
        }
      } else {
        card.classList.remove('active');
      }
    });

    if (!foundActive && currentActiveId !== null) {
      document.querySelectorAll('.program-card').forEach(c => c.classList.remove('active'));
      currentActiveId = null;
    }
  }

  // التشغيل عند التجميع
  renderSchedule();
  updateActiveProgram();

  // تحديث تلقائي كل 10 ثوانٍ لفحص الوقت
  setInterval(updateActiveProgram, 10000);
</script>

</body>
</html>
